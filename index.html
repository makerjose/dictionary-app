
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Dictionary App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Dictionary</h1>
    <p>Expand your vocabulary, pronunciation, synonyms and save fovorite words.</p>
    <button id="themeToggle" type="button">
      Dark Mode
    </button>
  </header>
  <main>
    <section class="search-section">
      <h2>Search for a Word</h2>
      <form id="searchForm">
        <label for="wordInput">Enter an English word</label>
        <div class="search-box">
          <input
            type="text"
            id="wordInput"
            placeholder="e.g. hello"
            aria-label="Enter a word"
            autocomplete="off"
            required
          >
          <button type="submit">Search</button>
        </div>
      </form>
    </section>

    <p id="message" role="status" aria-live="polite"></p>

    <section id="results" class="results" hidden>
      <div class="word-header">
        <div>
          <h2 id="wordTitle"></h2>
          <p id="phonetic"></p>
        </div>
        <button id="favoriteBtn" type="button">
          Save Word
        </button>
      </div>
      <div id="audioContainer"></div>
      <h3>Definitions</h3>
      <div id="definitions"></div>
      <h3>Synonyms</h3>
      <div id="synonyms"></div>
      <h3>Sources</h3>
      <div id="sources"></div>
    </section>

    <section class="favorites-section">
      <h2>Favorite Words</h2>
      <ul id="favoritesList"></ul>
    </section>
  </main>
  <footer>
    <p>Powered by Dictionary API</p>
  </footer>
</body>
</html>
